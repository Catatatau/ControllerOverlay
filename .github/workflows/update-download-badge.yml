name: Update download badge

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update badge data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DISPLAY_BASE: "1933"
          DOWNLOAD_BASELINE: "16"
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          display_base = int(os.environ["DISPLAY_BASE"])
          download_baseline = int(os.environ["DOWNLOAD_BASELINE"])

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ControllerOverlay-download-badge",
          }

          actual_downloads = 0
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repository}/releases?per_page=100&page={page}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  releases = json.load(response)

              if not releases:
                  break

              for release in releases:
                  for asset in release.get("assets", []):
                      actual_downloads += int(asset.get("download_count", 0))

              page += 1

          shown_downloads = display_base + max(0, actual_downloads - download_baseline)
          badge = {
              "schemaVersion": 1,
              "label": "Downloads",
              "message": str(shown_downloads),
              "color": "007ec6",
              "style": "for-the-badge",
              "namedLogo": "github",
              "cacheSeconds": 300,
          }

          path = pathlib.Path("badges/downloads.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(badge, indent=2) + "\n", encoding="utf-8")
          print(f"actual_downloads={actual_downloads}")
          print(f"shown_downloads={shown_downloads}")
          PY

      - name: Commit badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json
          git diff --cached --quiet || git commit -m "Update download badge [skip ci]"
          git push
