name: Build ControllerOverlay

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ControllerOverlay-Setup
          path: dist/ControllerOverlay-Setup-*.exe
