name: Build ControllerOverlay

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ControllerOverlay/ControllerOverlay.csproj

      - name: Build
        run: dotnet build src/ControllerOverlay/ControllerOverlay.csproj --configuration Release --no-restore

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ControllerOverlay-Setup
          path: dist/ControllerOverlay-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ControllerOverlay ${{ github.ref_name }}
          body: |
            Primeira release publica do ControllerOverlay.

            Destaques:
            - Overlay de controle para Rocket League com layout Xbox/PlayStation.
            - HUD separado para FPS e velocidade da bola.
            - Painel de configuracoes em Ctrl+Shift+C.
            - Opcoes para escala, transparencia, click-through e posicao do HUD.
            - Instalador Windows com atalhos e desinstalador.
          files: dist/ControllerOverlay-Setup-*.exe
