name: Build ControllerOverlay

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ControllerOverlay/ControllerOverlay.csproj

      - name: Build
        run: dotnet build src/ControllerOverlay/ControllerOverlay.csproj --configuration Release --no-restore

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControllerOverlay-Setup
          path: dist/ControllerOverlay-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ControllerOverlay ${{ github.ref_name }}
          body: |
            Release publica do ControllerOverlay.

            Destaques:
            - Overlay de controle para Rocket League com layout Xbox/PlayStation.
            - Modelos de teclado/mouse compactos e presets NohBoard embarcados no instalador.
            - Pasta do usuario para adicionar novos modelos keyboard.json.
            - Roda de cores livre para escolher qualquer cor do overlay.
            - HUD separado para FPS e velocidade da bola.
            - Painel de configuracoes em F2.
            - Opcoes para escala, transparencia, click-through e posicao do HUD.
            - Instalador Windows com atalhos e desinstalador.

            Instalacao automatica:
            irm https://raw.githubusercontent.com/Catatatau/ControllerOverlay/main/scripts/Install.ps1 | iex
          files: dist/ControllerOverlay-Setup-*.exe
