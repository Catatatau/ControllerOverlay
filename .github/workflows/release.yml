name: Build and Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore src/ControllerOverlay/ControllerOverlay.csproj

    - name: Build installer
      shell: pwsh
      run: ./installer/build-installer.ps1

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: latest
        name: "Latest Version"
        body: |
          Build gerado automaticamente pelo GitHub Actions.

          Instalacao automatica:
          irm https://raw.githubusercontent.com/Catatatau/ControllerOverlay/main/scripts/Install.ps1 | iex
        artifacts: "dist/ControllerOverlay-Setup-*.exe"
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}
